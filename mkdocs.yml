site_name: Tianshu Huang
nav:
  - About: index.md
  - Research: research.md
  - Open Source: open-source.md
  # - Photography: photography.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png
  icon:
    logo: octicons/person-16
    annotation: material/arrow-right-circle
  features:
    - navigation.instant
    - navigation.expand
    - navigation.tabs
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

watch:
  - docs
  - data
  - templates

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&display=swap
  - stylesheets/extra.css

plugins:
- photos:
    index: data/photos.yaml
- template:
    context: ./data
    templates: ./templates
- collaborators:
    index: data/people.yaml
- glightbox:
    manual: true

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >
  &copy; 2026 Tianshu Huang
