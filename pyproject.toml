[project]
name = "thetianshuhuang.github.io"
version = "1.0.0"
dependencies = [
    "tyro>=0.9.21",
    "jinja2>=3.1.6",
    "pillow>=11.2.1",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs_custom",
    "mkdocs_template"
]
requires-python = ">= 3.10"

[tool.uv.sources]
mkdocs_custom = { path = "plugin", editable = true }
mkdocs_template = { path = "plugin_v2", editable = true }
