publications:
  radarsim:
    title: "RadarSim: Simulating Single-Chip Radar via Multimodal Neural Fields"
    shorttitle: RadarSim
    venue: 3DV 2026
    tag: radar
    summary: We propose a unified differentiable renderer, RadarSim, which leverages the high angular resolution of RGB cameras to generate Doppler radar range images with accurate radar properties from a camera-initialized neural field.
    authors:
    - Chuhan Chen
    - Tianshu Huang
    - Akarsh Prabhakara
    - Chaithanya Kumar Mummadi
    - Zhongxia Cong
    - Anthony Rowe
    - Matthew O'Toole
    - Deva Ramanan

  grt:
    title: "Towards Foundational Models for Single-Chip Radar"
    shorttitle: GRT
    url: "https://wiselabcmu.github.io/grt/"
    venue: ICCV 2025
    comment: "**Oral Presentation &mdash; Top 0.57% (64/11152) of all submissions**"
    tag: radar
    summary: With enough training data, transformer models can extract 3D outputs of surprising quality from indexpensive, low-resolution single-chip radar. These models scale well with additional training data, and can generalize across different settings and be readily fine tuned for new tasks.
    figure: grt.svg
    authors:
    - Tianshu Huang
    - Akarsh Prabhakara
    - Chuhan Chen
    - Jay Karhade
    - Deva Ramanan
    - Matthew O'Toole
    - Anthony Rowe
    resources:
      Paper: https://arxiv.org/pdf/2509.12482?
      RadarML: https://radarml.github.io/
      Slides: https://wiselabcmu.github.io/grt/grt-slides.pdf
      Poster: https://wiselabcmu.github.io/grt/grt-poster.pdf

  beanstalk:
    title: "Unveiling Heisenbugs with Diversified Execution"
    shorttitle: Beanstalk
    url: https://dl.acm.org/doi/10.1145/3720428
    venue: OOPSLA 2025
    comment: "*Artifact Available &mdash; Artifact Functional &mdash; Results Reproduced*"
    tag: wasm
    summary: Heisenbugs - bugs which change their behavior under observation - are among the toughest challenges when debugging programs. We propose to catch these bugs using stochastic instrumentation, and demonstrate the surprising effectiveness of debugging across a diverse set of platforms.
    figure: beanstalk.svg
    authors:
    - Arjun Ramesh
    - Tianshu Huang
    - Jaspreet Singh Riar
    - Ben Titzer
    - Anthony Rowe
    resources:
      Github: https://github.com/arjunr2/beanstalk
      Instrumentation Framework: https://github.com/arjunr2/wasm-instrument
  pitot:
    title: "Interference-Aware Edge Runtime Prediction with Conformal Matrix Completion"
    shorttitle: Pitot
    venue: MLSys 2025
    comment: "*Artifact Available &mdash; Artifact Functional*"
    tag: wasm
    summary: Performance prediction in heterogeneous systems such as edge computing is best formulated as matrix completion, which can be extended to handle complex, edge-specific concerns such as interference and uncertainty quantification.
    url: https://arxiv.org/abs/2503.06428
    figure: pitot.png
    authors:
    - Tianshu Huang
    - Arjun Ramesh
    - Emily Ruppel
    - Nuno Pereira
    - Anthony Rowe
    - Carlee Joe-Wong
    resources:
      Github: https://github.com/WiseLabCMU/pitot
      Zenodo: https://zenodo.org/records/14977004
      Slides: resources/pitot_slides.pdf
  silverline:
    title: "Silverline: Lightweight Virtualization and Orchestration of Distributed Systems"
    shorttitle: Silverline
    venue: RTAS 2025
    tag: wasm
    summary: "We develop Silverline: a framework for programming heterogeneous dynamic distributed systems. Using WebAssembly as a lightweight virtualization framework, we design silverline to be fault-tolerant and real-time, and show it in use on industrial-grade systems."
    url: https://ieeexplore.ieee.org/document/11018768
    figure: silverline.svg
    authors:
    - Arjun Ramesh
    - Tianshu Huang
    - Emily Ruppel
    - Dakshina Dasari
    - Behnaz Pourmohseni
    - Fedor Smirnov
    - Marco Giani
    - Paolo Pazzaglia
    - Charles Shelton
    - Nuno Pereira
    - Arne Hamann
    - Dirk Ziegenbein
    - Anthony Rowe
  wali:
    title: "Empowering WebAssembly with Thin Kernel Interfaces"
    shorttitle: WALI
    venue: EuroSys 2025
    comment: "*Artifact Available &mdash; Artifact Functional &mdash; Results Reproduced*"
    tag: wasm
    figure: wali.svg
    summary: Webassembly (Wasm) adoption for new domains is often hindered by the lack of standard system interfaces. We propose directly exposing OS userspace syscalls as a compromise.
    url: https://arxiv.org/abs/2312.03858
    authors:
    - Arjun Ramesh
    - Tianshu Huang
    - Ben Titzer
    - Anthony Rowe
    resources:
      Github: https://github.com/arjunr2/WALI
      Rust Target: https://doc.rust-lang.org/nightly/rustc/platform-support/wasm32-wali-linux.html
  dart:
    title: "DART: Implicit Doppler Tomography for Radar Novel View Synthesis"
    shorttitle: DART
    displaytitle: "DART <img src='icons/dart.svg' style='height: 1.3em; width: auto; vertical-align: text-top'>"
    icon: icons/dart.svg
    subtitle: Implicit Doppler Tomography for Radar Novel View Synthesis
    summary: We propose DART &mdash; Doppler Aided Radar Tomography, a Neural Radiance Field-inspired approach to radar novel view synthesis using implicit neural inverse imaging.
    comment: "**Oral Presentation &mdash; Top 0.78% (90/11532) of all submissions**"
    venue: CVPR 2024
    tag: radar
    figure: dart.svg
    authors:
    - Tianshu Huang:*1
    - John Miller:*12
    - Akarsh Prabhakara:1
    - Tao Jin:1
    - Tarana Laroia:1
    - Zico Kolter:12
    - Anthony Rowe:12
    affiliations:
      "*": Equal Contribution
      1: Carnegie Mellon University
      2: Bosch Research
    url: https://wiselabcmu.github.io/dart/
    resources:
      Paper: https://arxiv.org/abs/2403.03896
      Implementation: https://github.com/WiseLabCMU/dart
      Data Collection: https://github.com/WiseLabCMU/rover
      Dataset: https://github.com/WiseLabCMU/dart/blob/main/docs/datasets.md
  l2o:
    title: "Optimizer Amalgamation"
    venue: ICLR 2022
    tag: misc
    summary: While meta-training optimizers from scratch is difficult, much attention has been directed towards developing a diverse body of analytical optimizers. Can we use these optimizers to meta-train a stronger optimizer?
    figure: optimizer_amalgamation.png
    url: https://arxiv.org/abs/2203.06474
    resources:
      Poster: resources/OptimizerAmalgamation-Poster.pdf
      Github: https://github.com/VITA-Group/OptimizerAmalgamation
    authors:
    - Tianshu Huang
    - Tianlong Chen
    - Sijia Liu
    - Shiyu Chang
    - Lisa Amini
    - Zhangyang Wang
