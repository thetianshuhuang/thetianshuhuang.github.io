<div style="width: 100%; display: grid; gap: 5px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));">

{% for photo in photos -%}
<a href="/assets/photos/{{ photo.path }}" class="glightbox {{ photo.aspect }}" data-description=".photo-desc-{{ photo.id }}"
style="font-size: 0px; position: relative;">
    <span></span>
    <img src="/assets/thumbs/{{ photo.path }}" alt="{{ photo.desc }}" style="width: 100%"/>
</a>
<div class="glightbox-desc photo-desc-{{ photo.id }}">
<div class="md-typeset">
    <div>{{ photo.desc }}</div>
    <div>
        <span class="twemoji"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m13.73 15-3.9 6.76a9.984 9.984 0 0 0 8.49-2.01l-3.66-6.35M2.46 15c.92 2.92 3.15 5.26 5.99 6.34L12.12 15m-3.58-3-3.9-6.75A9.86 9.86 0 0 0 2 12c0 .68.07 1.35.2 2h7.49m12.11-4h-7.49l.29.5 4.76 8.25A9.93 9.93 0 0 0 22 12c0-.69-.07-1.36-.2-2m-.26-1c-.92-2.93-3.15-5.26-5.99-6.34L11.88 9M9.4 10.5l4.77-8.26C13.47 2.09 12.75 2 12 2c-2.4 0-4.6.84-6.32 2.25l3.66 6.35z"/></svg></span>
        {{ photo.lens }}
        &nbsp;
        <span class="twemoji"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3"/></svg></span>
        {{ photo.body }}
    </div>
</div>
</div>

{%- endfor %}
</div>
