[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs_custom"
version = "0.0.0"

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "jinja2>=3.1.6",
    "pillow>=11.2.1",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
]

[project.entry-points."mkdocs.plugins"]
collaborators = "mkdocs_custom:CollaboratorsPlugin"
publications = "mkdocs_custom:PublicationsPlugin"
